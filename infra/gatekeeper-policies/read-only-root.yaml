apiVersion: templates.gatekeeper.sh/v1beta1
kind: ConstraintTemplate
metadata:
  name: k8sreadonlyrootfilesystem
spec:
  crd:
    spec:
      names:
        kind: K8sReadOnlyRootFilesystem
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package k8sreadonlyrootfilesystem

        violation[{"msg": msg}] {
          container := input.review.object.spec.containers[_]
          not is_read_only(container)
          msg := sprintf("Root filesystem must be read-only for container: %s", [container.name])
        }

        is_read_only(container) {
          container.securityContext.readOnlyRootFilesystem == true
        }
---
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sReadOnlyRootFilesystem
metadata:
  name: enforce-read-only-root
spec:
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
